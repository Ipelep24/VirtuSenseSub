<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="VirtuSense - Video conferencing with real-time emotion detection and analysis. Understand participant engagement and emotional responses during online meetings and virtual events"><script>// Initialize Trusted Types policy to satisfy CSP requirements
    if (window.trustedTypes && trustedTypes.createPolicy) {
      try {
        trustedTypes.createPolicy('default', {
          createHTML: (string) => string,
          createScriptURL: (string) => string,
          createScript: (string) => string
        });
        console.log('✅ Trusted Types policy initialized');
      } catch (e) {
        // Policy might already exist, that's okay
        if (e.name !== 'DataCloneError') {
          console.warn('Trusted Types policy warning:', e.message);
        }
      }
    }</script><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><base href="/"/><title>VirtuSense</title><script>(function () {
      const ua = navigator.userAgent || navigator.vendor || window.opera;

      // Enhanced detection for iOS and Android
      const isFB = (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1) || (ua.indexOf('FB_IAB') > -1);
      const isMessenger = (ua.indexOf('MessengerLite') > -1) || (ua.indexOf('FB_IAB/MESSENGER') > -1) || (ua.indexOf('MESSENGER') > -1);
      const isIG = (ua.indexOf('Instagram') > -1);

      // Additional iOS-specific check
      const isIOSWebView = /(iPhone|iPod|iPad).*AppleWebKit(?!.*Safari)/i.test(ua);
      const isFBiOS = isIOSWebView && (isFB || isMessenger || isIG);

      if (isFB || isMessenger || isIG || isFBiOS) {

        // Function to render the blocking UI
        function showBlockingUI() {
          // Add toast animation CSS
          const style = document.createElement('style');
          style.textContent = '@keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }';
          document.head.appendChild(style);

          const appDiv = document.getElementById('react-app');
          if (appDiv) {
            appDiv.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center;background:#1c1c1b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
                  <div style="background:white;border-radius:8px;padding:30px;max-width:400px;background:#1d1d1d;border:1px solid #2d2d2d;color:white;">
                    <h2 style="margin-bottom:16px;">⚠️ Incompatible Browser</h2>
                    <p style="color:#99a1af;margin-bottom:24px;line-height:1.5">
                      This website isn't compatible with Facebook/Messenger's in-app browser.
                    </p>
                    <p style="margin-bottom:16px;font-weight:bold">
                      Please open this link in Chrome, Safari, Edge, or any external browser.
                    </p>
                    <button id="copyBtn" style="background:#1a7368;border:none;border-radius:6px;padding:12px 24px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;color:white">
                      Copy Link
                    </button>
                  </div>
                  <div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1d1d;color:white;border:1px solid #2d2d2d;padding:12px 24px;border-radius:8px;font-size:14px;box-shadow:0 4px 6px rgba(0,0,0,0.3);z-index:1000;animation:slideUp 0.3s ease">
                  Copied to Clipboard
                  </div>
                </div>
              `;

            // Add copy functionality
            setTimeout(function () {
              const btn = document.getElementById('copyBtn');
              const toast = document.getElementById('toast');

              if (btn && toast) {
                btn.addEventListener('click', function () {
                  // iOS-friendly clipboard handling
                  const url = window.location.href;

                  if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url)
                      .then(function () {
                        toast.style.display = 'block';
                        setTimeout(function () {
                          toast.style.display = 'none';
                        }, 3000);
                      })
                      .catch(function () {
                        // Fallback for iOS
                        fallbackCopy(url);
                      });
                  } else {
                    fallbackCopy(url);
                  }
                });
              }

              function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();

                try {
                  document.execCommand('copy');
                  toast.style.display = 'block';
                  setTimeout(function () {
                    toast.style.display = 'none';
                  }, 3000);
                } catch (err) {
                  prompt('Copy this link:', text);
                }

                document.body.removeChild(textarea);
              }
            }, 100);
          }
        }

        // Handle both DOMContentLoaded and immediate execution
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', showBlockingUI);
        } else {
          // DOM already loaded (common in iOS)
          showBlockingUI();
        }

        // Failsafe: try again after a short delay if element wasn't found
        setTimeout(function () {
          if (document.getElementById('react-app') && !document.getElementById('copyBtn')) {
            showBlockingUI();
          }
        }, 50);
      }
    })();</script></head><body><style>::-webkit-scrollbar {
      width: 0px;
    }

    ::-webkit-scrollbar-track {
      background-color: transparent;
    }

    video::-webkit-media-controls-play-button {
      display: none !important;
    }</style><div id="react-app" style="height: 100vh;
        max-height: -webkit-fill-available;
        display: flex;"></div><script src="main.js"></script></body></html>
