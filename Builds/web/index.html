<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><base href="/"/><title>VirtuSense</title><script>(function() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isFB = (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1);
        const isMessenger = (ua.indexOf('MessengerLite') > -1) || (ua.indexOf('FB_IAB/MESSENGER') > -1);
        const isIG = (ua.indexOf('Instagram') > -1);
        
        if (isFB || isMessenger || isIG) {
          document.addEventListener('DOMContentLoaded', function() {
            // Add toast animation CSS
            const style = document.createElement('style');
            style.textContent = '@keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }';
            document.head.appendChild(style);
            
            document.getElementById('react-app').innerHTML = `
              <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center;background:#1c1c1b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
                <div style="background:white;border-radius:8px;padding:30px;max-width:400px;background:#1d1d1d;border:1px solid #2d2d2d;color:white;">
                  <h2 style="margin-bottom:16px;">⚠️ Incompatible Browser</h2>
                  <p style="color:#99a1af;margin-bottom:24px;line-height:1.5">
                    This website isn't compatible with Facebook/Messenger's in-app browser.
                  </p>
                  <p style="margin-bottom:16px;font-weight:bold">
                    Please open this link in Chrome, Safari, Edge, or any external browser.
                  </p>
                  <button id="copyBtn" style="background:#1a7368;border:none;border-radius:6px;padding:12px 24px;font-size:15px;font-weight:bold;cursor:pointer;width:100%">
                    Copy Link
                  </button>
                </div>
                <div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1d1d;color:white;border:1px solid #2d2d2d;padding:12px 24px;border-radius:8px;font-size:14px;box-shadow:0 4px 6px rgba(0,0,0,0.3);z-index:1000;animation:slideUp 0.3s ease">
                  Copied to Clipboard
                </div>
              </div>
            `;
            
            // Add toast functionality
            setTimeout(function() {
              const btn = document.getElementById('copyBtn');
              const toast = document.getElementById('toast');
              
              btn.addEventListener('click', function() {
                navigator.clipboard.writeText(window.location.href)
                  .then(function() {
                    // Show toast
                    toast.style.display = 'block';
                    setTimeout(function() {
                      toast.style.display = 'none';
                    }, 3000);
                  })
                  .catch(function() {
                    prompt('Copy this link:', window.location.href);
                  });
              });
            }, 100);
          });
        }
      })();</script></head><body><style>/* .video-container > *{
            background-color: #000 !important;

        }
        .video-container video{
            background-color: #000;
        }
        .video-container{
            background-color: #000;
        } */
      /* *:active {
            outline: none;
        } */
      /* Webkit (Chrome, Safari) */
      ::-webkit-scrollbar {
        width: 0px;
      }

      ::-webkit-scrollbar-track {
        background-color: transparent;
      }

      /** to hide screenshare fullscreen play/pause button  */
      video::-webkit-media-controls-play-button {
        display: none !important;
      }</style><div id="react-app" style="height: 100vh;
        max-height: -webkit-fill-available;
        display: flex;"></div><script src="main.js"></script></body></html>
